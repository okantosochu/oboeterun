<!doctype html><html lang="ja"><meta charset="utf-8"><title>core tests</title><body><pre id="out"></pre><script src="../js/config.js"></script><script src="../js/storage.js"></script><script src="../js/stories.js"></script><script>
const out=document.querySelector('#out');let ok=0,ng=0;function test(name,fn){try{fn();out.textContent+=`✓ ${name}\n`;ok++}catch(e){out.textContent+=`✗ ${name}: ${e.message}\n`;ng++}}function eq(a,b){if(a!==b)throw new Error(`${a} !== ${b}`)}
test('ローカル日付の加算',()=>eq(Store.addDays('2026-09-02',1),'2026-09-03'));
test('月末の日付加算',()=>eq(Store.addDays('2026-09-30',1),'2026-10-01'));
test('日数差',()=>eq(Store.dayDiff('2026-09-02','2026-09-20'),18));
test('初期データ構造',()=>{const d=Store.fresh();eq(d.schemaVersion,1);eq(d.cards.length,0)});
test('正しいバックアップ',()=>eq(Store.validImport(Store.fresh()),true));
test('不正バックアップ拒否',()=>eq(Boolean(Store.validImport({cards:[]})),false));
test('MAIN 180話',()=>eq(STORY_EPISODES.filter(e=>e.type==='MAIN').length,180));
test('SIDEを収録',()=>{if(STORY_EPISODES.filter(e=>e.type==='SIDE').length<1)throw new Error('SIDEなし')});
out.textContent+=`\n${ok} passed, ${ng} failed`;
</script></body></html>
